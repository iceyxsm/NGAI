[project]
name = "ngai"
version = "0.1.0"
description = "Next Gen Artificial Intelligence - Novel training and inference for 100B+ param models on minimal hardware"
readme = "README.md"
authors = [
    { name = "iceyxsm", email = "shivmunot9@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ngai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
